spring.application.name=Test

# PostgreSQL (chạy bằng `docker compose up -d`, có thể ghi đè bằng biến môi trường)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voucherdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# update: giữ dữ liệu giữa các lần chạy (khác create-drop của H2 in-memory)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thư mục chứa file tổng hợp kiến thức
app.knowledge.dir=knowledge
